<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>234562 장은서</title>
    <style>
        div{
            position:absolute;
        }
        img{
            position:absolute;
        }
        #index1{
            z-index:-2;
            left:100px;
        }
        #index2{
            z-index:-1;
            left: 120px;
            top:30px;
        }
        #index3{
            z-index:1;
            left:200px;
            top:80px;
        }
        #index4{
            z-index:0;
            left:50px;
            top:80px;
        }
    </style>
</head>
<body>
    <h2>Z-index</h2>
    <hr>
    <div>
        <img id="index1" src="livemylife.jpg" width="100px">
        <img id="index2" src="움직여.png" width="100px">
        <img id="index3"src="drip.png" width="100px">
        <img id="index4" src="weekend.png" width="100px">
    </div>
</body>
</html>
